# Deploy lên Render: New → Blueprint → trỏ vào repo này.
# Gói free ngủ sau 15 phút không dùng, lần mở đầu tiên chờ ~30 giây rồi chạy bình thường.
# Dùng chatbot Pancake thì nên lên gói trả phí (Starter): máy ngủ thì tin khách đầu tiên dễ bị lỡ.
services:
  - type: web
    name: dich-chat-1688
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Các biến "sync: false" tự điền trong Dashboard, KHÔNG commit vào repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
      # Chatbot Pancake (xem README mục "Chatbot Pancake")
      - key: PANCAKE_PAGE_ID
        sync: false
      - key: PANCAKE_PAGE_ACCESS_TOKEN
        sync: false
      - key: PANCAKE_WEBHOOK_SECRET
        generateValue: true
      - key: BOT_MODE
        value: shadow
