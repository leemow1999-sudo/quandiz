# --- Sản phẩm ---
# Giá ฿890 là MỨC ĐỀ XUẤT cho COD Thái (giá vốn + ship + ~35% ngân sách ads).
# Tính lại theo giá nhập thật rồi sửa cả 3 dòng price/price-old/save,
# và sửa giá 3 gói trong ladipage-blocks/09-order.html (cả data-price).
product-name  = เราเตอร์พกพาใส่ซิม PLERY M305-CT
price         = ฿890
price-old     = ฿1,690
save          = ประหยัด ฿800

# --- Social proof (chỉ điền số THẬT từ shop/page của mày) ---
rating        = 4.8
rating-count  = 1,204
stock         = 100

# --- Cửa hàng (Facebook Thái bắt buộc có thông tin liên hệ thật) ---
shop-name     = [ชื่อร้าน / ชื่อบริษัท]
shop-address  = [ที่อยู่ร้าน เลขที่ ถนน แขวง เขต จังหวัด รหัสไปรษณีย์]
hotline       = 02-XXX-XXXX
line-id       = @yourshop
email         = contact@yourshop.com
tax-id        = [เลขนิติบุคคล/ทะเบียนพาณิชย์]

# --- Thông số PHẢI xác minh với nhà cung cấp trước khi chạy ads ---
bands         = [ยืนยันกับผู้จำหน่าย — ต้องรองรับ B1 / B3 / B8 / B28 / B41 จึงใช้กับค่ายในไทยได้ครบ]
max-devices   = [ยืนยันกับผู้จำหน่าย] เครื่อง
